services:
  clientemqtt:
    build:
      ./clienteMqtt
    image: clientemqtt
    container_name: clientemqtt
    env_file:
      - .env
    environment:
      - TZ=America/Argentina/Buenos_Aires 
      - SERVIDOR=${SERVIDOR} #Se reemplazará por la env var SERVIDOR defineda en .env
      - TOPICO1=${TOPICO1}
      - TOPICO2=${TOPICO2}
      - TOPICO3=${TOPICO3}
    restart: unless-stopped