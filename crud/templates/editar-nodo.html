{% extends "layout.html" %} 

{% block body %}
<div class="row">
  <div class="col-md-4 offset-md-4">
    <div class="card card-body">
      <h4 class="mb-3">Editar Dispositivo</h4>
      <form action="{{url_for('actualizar_nodo', id=nodo.0)}}" method="POST">
        <div class="form-group mb-3">
          <label class="form-label">Nombre:</label>
          <input type="text" name="nombre" class="form-control" value="{{nodo.2}}" required />
        </div>
        <div class="form-group mb-3">
          <label class="form-label">MAC:</label>
          <input type="text" name="mac" class="form-control" value="{{nodo.1}}" required />
        </div>
        <button type="submit" class="btn btn-success w-100">Actualizar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
